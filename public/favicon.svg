<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="logo-disc" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1b1b2c" />
      <stop offset="70%" stop-color="#0d0d15" />
      <stop offset="100%" stop-color="#060609" />
    </radialGradient>
    <linearGradient id="logo-label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#8b2fe8" />
    </linearGradient>
    <clipPath id="logo-clip">
      <circle cx="24" cy="24" r="22" />
    </clipPath>
  </defs>

  <circle cx="24" cy="24" r="22" fill="url(#logo-disc)" stroke="#8b2fe8" stroke-opacity="0.55" stroke-width="1.2" />

  <g clip-path="url(#logo-clip)">
    <circle cx="24" cy="24" r="19" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.7" />
    <circle cx="24" cy="24" r="16" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="0.7" />
    <circle cx="24" cy="24" r="13" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="0.7" />
    <ellipse cx="15" cy="13" rx="12" ry="5" fill="#fff" fill-opacity="0.09" transform="rotate(-35 15 13)" />
  </g>

  <circle cx="24" cy="24" r="9" fill="url(#logo-label)" />
  <circle cx="24" cy="24" r="9" fill="none" stroke="#ff2d95" stroke-width="1.1" />
  <circle cx="24" cy="24" r="1.8" fill="#060609" />
  <circle cx="24" cy="24" r="1.8" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="0.5" />
</svg>
